<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f5f7}
a{color:#0066cc;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#c8381e"></rect><text x="50" y="62" font-size="34" font-weight="800" text-anchor="middle" fill="#fff" font-family="sans-serif">CC</text></svg></template>
<dc-import name="dashboard" guest-only="{{ true }}" is-public="{{ isPublic }}" sync-url="{{ syncUrl }}" hint-size="100%,100vh"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;isPublic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;공개&quot;},&quot;syncUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;구글시트 연동&quot;}}">
class Component extends DCLogic {
  renderVals() { return { isPublic: this.props.isPublic !== false, syncUrl: this.props.syncUrl || '' }; }
}
</script>
</body>
</html>
